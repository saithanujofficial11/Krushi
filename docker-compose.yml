version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: krushi-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: .
    container_name: krushi-server
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017
    volumes:
      - ./data:/root/data

volumes:
  mongo-data:
